name: best_u
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  video_player: ^2.9.1
  cloud_firestore:
  google_fonts: ^6.3.0
  firebase_auth: 6.4.0 
  firebase_core: ^4.7.0
  google_sign_in: ^6.2.2
  skeletonizer: ^2.1.3
  app_links: ^6.4.1
  image_picker: ^1.2.2
  shared_preferences: ^2.5.5
  flutter_animate: ^4.5.2
  timezone: ^0.9.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^18.0.1
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/welcom-logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/data/
    - assets/video/excercise-video.mp4
    - assets/video/exercises/
    - assets/sound/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
